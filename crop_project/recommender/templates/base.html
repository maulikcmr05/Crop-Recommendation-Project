{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crop Recommendation System{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon-64.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.9/css/bootstrap.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-success bg-opacity-25 shadow-sm rounded-bottom-4 px-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="#"><i class="fas fa-seedling me-2 text-success"></i>Crop Recommendation</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#"><i class="fas fa-home me-2 text-success"></i>Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#"><i class="fas fa-user me-2 text-success"></i> Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#"><i class="fas fa-user-plus me-2 text-success"></i>Sign Up</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#"><i class="fas fa-lock me-2 text-success"></i>Admin</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
    <main class="container-fluid py-4 px-3">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.9/js/bootstrap.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js" integrity="sha512-AA1Bzp5Q0K1KanKKmvN/4d3IRKVlv9PYgwFPvm32nPO6QS8yH1HO7LbgB1pgiOxPtfeg5zEn2ba64MUcqJx6CA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
