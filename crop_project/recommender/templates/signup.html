{% extends 'base.html' %}
{% load static %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-xl-10">
        <div class="card mnc-card overflow-hidden">
            <div class="row g-0">
                <!-- Left Panel: Full Edge-to-Edge Image -->
                <div class="col-lg-5 d-none d-lg-block" style="min-height: 480px; background: #0b2416 url('{% static 'images/signup-image.png' %}') center center / cover no-repeat;">
                </div>

                <!-- Right Panel: Sign Up Form -->
                <div class="col-lg-7 p-4 p-md-5 bg-white d-flex flex-column justify-content-center">
                    <span class="badge bg-success-subtle text-success border border-success-subtle align-self-start px-3 py-1 mb-2 fw-bold">
                        CROP RECOMMENDATION SYSTEM
                    </span>
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small mb-4">Fill in your details below to register</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user text-success"></i></span>
                                    <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope text-success"></i></span>
                                    <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone text-success"></i></span>
                                    <input type="tel" class="form-control" name="phone" placeholder="Enter phone number" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock text-success"></i></span>
                                    <input type="password" class="form-control" name="password" minlength="8" placeholder="Minimum 8 characters" required>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-mnc w-100 py-2 mt-4 mb-3">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                        <div class="text-center small text-muted">
                            Already have an account? <a href="{% url 'login' %}" class="text-success fw-semibold text-decoration-none">Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
